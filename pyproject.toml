[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pixelgen"
version = "0.1.0"
description = "Turn a natural-language prompt into true pixel art."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Armando Herra" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.4",
    "numpy>=1.26",
    "anthropic>=0.40",
    "pyyaml>=6.0.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pixelgen = "pixelgen.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "allow_anthropic_client: permit constructing an anthropic client object; SDK requests stay blocked (tests/conftest.py)",
]
