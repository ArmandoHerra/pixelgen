name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No LLM API secret is needed or referenced anywhere in this workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          enable-cache: false
      - name: Install
        run: uv sync --locked
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - name: Test
        run: uv run --no-sync python -m pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Non-editable install into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install .
      - name: Smoke the installed package
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/smoke-venv/bin/pixelgen" --help
          "$RUNNER_TEMP/smoke-venv/bin/python" -c "import pixelgen"
          "$RUNNER_TEMP/smoke-venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/check_installed_package.py" "$GITHUB_WORKSPACE/src/pixelgen"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          enable-cache: false
      - name: Install
        run: uv sync --locked
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - name: Ruff version
        run: uv run --no-sync python -m ruff --version
      - name: Ruff check
        run: uv run --no-sync python -m ruff check .
      - name: Ruff format
        run: uv run --no-sync python -m ruff format --check .
